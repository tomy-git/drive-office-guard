<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Breakage Blocker for Google Drive 設定</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f6f7f9;
        color: #1f2937;
      }

      body {
        margin: 0;
      }

      main {
        width: min(760px, calc(100vw - 40px));
        margin: 48px auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        line-height: 1.3;
      }

      .lead {
        margin: 0 0 28px;
        color: #475467;
        line-height: 1.7;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
        background: #ffffff;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
      }

      input {
        width: 18px;
        height: 18px;
        margin-top: 3px;
      }

      strong {
        display: block;
        margin-bottom: 4px;
      }

      small {
        color: #667085;
        line-height: 1.5;
      }

      .managed {
        color: #175cd3;
      }

      button {
        justify-self: start;
        margin-top: 8px;
        border: 0;
        border-radius: 6px;
        padding: 10px 16px;
        background: #1f2937;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      [role="status"] {
        min-height: 24px;
        margin-top: 16px;
        color: #067647;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Office Breakage Blocker for Google Drive 設定</h1>
      <p class="lead">
        Google Drive から起動する Google エディタと、docs.google.com
        への直接アクセスをサービス単位で制限します。
      </p>
      <form id="options-form">
        <label>
          <input type="checkbox" name="blockSheets" />
          <span>
            <strong>Google スプレッドシートを制限</strong>
            <small>Excel ファイルを Google Sheets で開く導線を無効化します。</small>
          </span>
        </label>
        <label>
          <input type="checkbox" name="blockSlides" />
          <span>
            <strong>Google スライドを制限</strong>
            <small
              >PowerPoint ファイルを Google Slides で開く導線を無効化します。</small
            >
          </span>
        </label>
        <label>
          <input type="checkbox" name="blockDocs" />
          <span>
            <strong>Google ドキュメントを制限</strong>
            <small>Word ファイルを Google Docs で開く導線を無効化します。</small>
          </span>
        </label>
        <button type="submit">保存</button>
      </form>
      <p id="options-status" role="status" aria-live="polite"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
