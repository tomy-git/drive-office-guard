<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Office Breakage Blocker for Google Drive 設定</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f6f7f9;
        color: #1f2937;
      }

      body {
        margin: 0;
      }

      main {
        width: min(760px, calc(100vw - 40px));
        margin: 48px auto;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.75rem;
        line-height: 1.3;
      }

      .lead {
        margin: 0 0 28px;
        color: #475467;
        line-height: 1.7;
      }

      form {
        display: grid;
        gap: 14px;
      }

      label {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
        background: #ffffff;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
      }

      input {
        width: 18px;
        height: 18px;
        margin-top: 3px;
      }

      strong {
        display: block;
        margin-bottom: 4px;
      }

      small {
        color: #667085;
        line-height: 1.5;
      }

      .managed {
        color: #175cd3;
      }

      button {
        margin-top: 8px;
        border: 0;
        border-radius: 6px;
        padding: 10px 16px;
        background: #1f2937;
        color: #ffffff;
        font-weight: 600;
        cursor: pointer;
      }

      .actions {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .secondary {
        background: #ffffff;
        color: #1f2937;
        border: 1px solid #d0d5dd;
      }

      [hidden] {
        display: none !important;
      }

      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .toast {
        position: fixed;
        inset-block-start: 20px;
        inset-inline-end: 20px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: min(420px, calc(100vw - 40px));
        padding: 14px 16px;
        border: 1px solid #abefc6;
        border-radius: 8px;
        background: #ecfdf3;
        color: #067647;
        box-shadow: 0 14px 36px rgba(15, 23, 42, 0.16);
      }

      .toast[data-kind="error"] {
        border-color: #fecdca;
        background: #fef3f2;
        color: #b42318;
      }

      .toast p {
        margin: 0;
        line-height: 1.5;
      }

      .toast button {
        margin: -4px -6px -4px 0;
        padding: 4px 8px;
        border: 0;
        background: transparent;
        color: inherit;
        font-size: 1.1rem;
        line-height: 1;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Office Breakage Blocker for Google Drive 設定</h1>
      <p class="lead">
        Google Drive から起動する各種 Google のオフィススイート製品と、docs.google.com
        への直接アクセスをサービス単位で制限します。
      </p>
      <form id="options-form">
        <label>
          <input type="checkbox" name="blockSheets" />
          <span>
            <strong>Google スプレッドシートを制限</strong>
            <small>Excel ファイルを Google Sheets で開く機能を無効化します。</small>
          </span>
        </label>
        <label>
          <input type="checkbox" name="blockSlides" />
          <span>
            <strong>Google スライドを制限</strong>
            <small
              >PowerPoint ファイルを Google Slides で開く機能を無効化します。</small
            >
          </span>
        </label>
        <label>
          <input type="checkbox" name="blockDocs" />
          <span>
            <strong>Google ドキュメントを制限</strong>
            <small>Word ファイルを Google Docs で開く機能を無効化します。</small>
          </span>
        </label>
        <label>
          <input type="checkbox" name="hideDisabledLabel" />
          <span>
            <strong>無効化理由の括弧書きを非表示</strong>
            <small>
              Google Drive
              のメニュー上ではグレーアウトだけを行い、「拡張機能により無効化」の表示を追加しません。
            </small>
          </span>
        </label>
        <div class="actions">
          <button type="submit">保存</button>
          <button class="secondary" id="cancel-button" type="button" hidden>
            キャンセル
          </button>
        </div>
      </form>
    </main>
    <div class="toast" id="options-toast" role="status" aria-live="polite" hidden>
      <p id="options-toast-message"></p>
      <button id="options-toast-close" type="button" aria-label="通知を閉じる">
        ×
      </button>
    </div>
    <script src="options.js"></script>
  </body>
</html>
