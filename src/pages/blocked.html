<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Drive上での直接編集は制限されています</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #f6f7f9;
        color: #1f2937;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(640px, calc(100vw - 40px));
        background: #ffffff;
        border: 1px solid #d0d5dd;
        border-radius: 8px;
        padding: 32px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.12);
      }

      h1 {
        margin: 0 0 16px;
        font-size: 1.5rem;
        line-height: 1.35;
      }

      p {
        margin: 0 0 12px;
        font-size: 1rem;
        line-height: 1.7;
      }

      ul {
        margin: 12px 0 16px;
        padding-inline-start: 24px;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Google のオフィススイート製品は制限されています</h1>
      <p>
        この組織では、Microsoft Office ファイルの互換性を守るため、以下の Google Docs /
        Sheets / Slides の利用を制限しています。
      </p>
      <ul id="blocked-services" aria-live="polite">
        <li>制限対象を確認しています。</li>
      </ul>
      <p>Google Drive の「プレビュー」または「ダウンロード」を使用してください。</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
