# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check SPDX headers
        run: npm run license:check

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Build Chrome
        run: npm run build:chrome

  package-firefox:
    name: Package Firefox add-on
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Firefox add-on
        run: npm run package:firefox

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-addon
          path: web-ext-artifacts/firefox-addon.zip
          if-no-files-found: error
          retention-days: 14

  package-chrome:
    name: Package Chrome extension
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Chrome extension
        run: npm run package:chrome

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: web-ext-artifacts/chrome-extension.zip
          if-no-files-found: error
          retention-days: 14

  publish-firefox:
    name: Release Firefox add-on
    runs-on: ubuntu-latest
    needs: package-firefox
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Release placeholder
        run: echo "Firefox release flow is intentionally not configured yet."

  publish-chrome:
    name: Release Chrome extension
    runs-on: ubuntu-latest
    needs: package-chrome
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Release placeholder
        run: echo "Chrome release flow is intentionally not configured yet."
