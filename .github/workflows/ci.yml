# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package version is not already released
        if: github.event_name == 'pull_request'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          echo "package.json version: ${VERSION}"
          echo "expected tag: ${TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Error: ${TAG} already exists. Please bump package.json version."
            exit 1
          fi

      - name: Check SPDX headers
        run: npm run license:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Run tests
        run: npm test

      - name: Run coverage
        run: npm run test:coverage

      - name: Build Firefox
        run: npm run build:firefox

      - name: Build Chrome
        run: npm run build:chrome

      - name: Check manifest version
        run: npm run check:manifest-version

      - name: Lint extension
        run: npm run lint:ext

  package-firefox:
    name: Package Firefox add-on
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Firefox add-on
        run: npm run package:firefox

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: firefox-addon
          path: web-ext-artifacts/firefox-addon.zip
          if-no-files-found: error
          retention-days: 14

  package-chrome:
    name: Package Chrome extension
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Chrome extension
        run: npm run package:chrome

      - name: Upload Chrome package
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: web-ext-artifacts/chrome-extension.zip
          if-no-files-found: error
          retention-days: 14
