# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: License headers and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check SPDX headers
        run: npm run license:check

      - name: Run tests
        run: npm test
