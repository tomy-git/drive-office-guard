# SPDX-License-Identifier: MPL-2.0

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

jobs:
  test:
    name: Verify extension
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package version is not already released
        if: github.event_name == 'pull_request'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"

          echo "package.json version: ${VERSION}"
          echo "expected tag: ${TAG}"

          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Error: ${TAG} already exists. Please bump package.json version."
            exit 1
          fi

      - name: Check SPDX headers
        run: npm run license:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Check manifest version
        run: npm run check:manifest-version

      - name: Lint extension
        run: npm run lint:ext
