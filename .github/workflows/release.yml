# SPDX-License-Identifier: MPL-2.0

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Release extension
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME}"

          echo "package.json version: ${VERSION}"
          echo "git tag: ${TAG}"

          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "Error: Git tag and package.json version do not match."
            exit 1
          fi

      - name: Check SPDX headers
        run: npm run license:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Check manifest version
        run: npm run check:manifest-version

      - name: Lint extension
        run: npm run lint:ext

      - name: Package Firefox extension
        run: npm run package:firefox

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release create "${GITHUB_REF_NAME}" \
            "web-ext-artifacts/drive-office-guard-${VERSION}.zip" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Release ${GITHUB_REF_NAME}"
